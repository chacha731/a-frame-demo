<!DOCTYPE html> 
<html> 
    <head>
         <meta charset="utf-8">
          <title>空間情報コンピューティング課題７</title>
           <meta name=“description” content=“空間情報コンピューティング課題７"> 
           <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
         </head>
<body>
    <a-scene shadow="type: pcfsoft" background="color: #DCE8F2">
    <a-assets>
    <a-asset-item id="exhibit-model" src="Untitled.glb"></a-asset-item>
  </a-assets>

    <a-entity light="type: ambient; color: #FFF8EE; intensity: 0.55"></a-entity>
    <a-entity light="type: point; color: #FFE4B5; intensity: 0.9; distance: 12; castShadow: true" position="0 2.7 -2"></a-entity>

    
    <!-- 床 -->
    <a-plane position="0 0 -2" rotation="-90 0 0" width="6" height="6" color=#FFC0CB roughness="0.8" shadow="receive: true"></a-plane>
    <!-- 天井 -->
    <a-plane position="0 3 -2" rotation="90 0 0" width="6" height="6" color="#F4C2C2"></a-plane>
    <!-- 壁 -->
    <a-plane position="0 1.5 -5" rotation="0 0 0" width="6" height="3" color="#FC8EAC" shadow="receive: true"></a-plane>
    <a-plane position="0 1.5 1" rotation="0 180 0" width="6" height="3" color="#FC8EAC"></a-plane>
    <a-plane position="-3 1.5 -2" rotation="0 90 0" width="6" height="3" color="#FC8EAC" shadow="receive: true"></a-plane>
    <a-plane position="3 1.5 -2" rotation="0 -90 0" width="6" height="3" color="#FC8EAC" shadow="receive: true"></a-plane>
    <!-- 窓 -->
    <a-plane position="2.98 1.6 -2" rotation="0 -90 0" width="2.2" height="1.3" color="#BFE6FF" emissive="#87CEFA" emissive-intensity="0.35"></a-plane>
    <a-box position="2.97 1.6 -2" width="0.04" height="1.3" depth="0.05" color="#FFFFFF"></a-box>
    <a-box position="2.97 1.6 -2" width="0.04" height="0.05" depth="2.2" color="#FFFFFF"></a-box>

    <!-- マット -->
    <a-box position="0 0.01 -2.2" width="3.0" height="0.02" depth="2.2" color="#c18eda" shadow="receive: true"></a-box>

    <!-- 展示台・オブジェ-->
    <a-box position="0 0.45 -2" width="0.8" height="0.9" depth="0.8" color="#000000" shadow="cast: true; receive: true"></a-box>
    <a-gltf-model src="#exhibit-model"　position="0 1.35 -2" radius="0.22" radius-tubular="0.05" color="#EF2D5E" shadow="cast: true"
      animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
    </a-gltf-model>


    <!-- シーリングライト -->
    <a-cylinder position="0 2.95 -2" radius="0.35" height="0.08" color="#FFFFFF" emissive="#FFF5D6" emissive-intensity="0.6"></a-cylinder>

    <!-- カメラ -->
    <a-entity position="0 0.2 0">
      <a-camera></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
